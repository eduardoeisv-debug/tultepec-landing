<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- #1a1b4b: el tono más oscuro del degradado de fondo de Menú
         Cristal (ver .cristal-root en CristalShell.css), no el
         --color-night-900 genérico de antes -- para que la barra de
         estado/gestos del sistema combine con el fondo real. -->
    <meta name="theme-color" content="#1a1b4b" />
    <!-- viewport-fit=cover: sin esto, la página no se extendía debajo
         de la barra de gestos de Android/el borde redondeado de
         iPhone, y esa franja quedaba pintada por el sistema (blanca)
         en vez de por nuestro CSS -- env(safe-area-inset-bottom) de
         abajo tampoco hace nada sin este cover. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Tultepec convierte el fuego en arte: castillos y toritos que sus familias han heredado por generaciones. Historia, memorias y tradiciones de la Capital de la Pirotecnia."
    />
    <title>Tultepec · Pueblo Pirotécnico</title>

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Tultepec · Pueblo Pirotécnico" />
    <meta property="og:title" content="Tultepec · Pueblo Pirotécnico" />
    <meta
      property="og:description"
      content="Tultepec convierte el fuego en arte: castillos y toritos que sus familias han heredado por generaciones."
    />
    <meta property="og:url" content="https://tultepec-landing.vercel.app/" />
    <meta property="og:image" content="https://tultepec-landing.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tultepec · Pueblo Pirotécnico, con la silueta del pueblo al atardecer" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tultepec · Pueblo Pirotécnico" />
    <meta
      name="twitter:description"
      content="Tultepec convierte el fuego en arte: castillos y toritos que sus familias han heredado por generaciones."
    />
    <meta name="twitter:image" content="https://tultepec-landing.vercel.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
